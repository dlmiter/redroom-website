<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Karaoke Uppsala | Red room</title>

    <meta
        name="description"
        content="Karaoke i Uppsala på Red room, Kungsgatan 41. Open mic-karaoke onsdag–lördag med biljard i centrala Uppsala."
    >

    <link rel="canonical" href="https://redroomuppsala.se/">
    <script type="application/ld+json">
    {
        "@context": "https://schema.org",
        "@type": "LocalBusiness",
        "name": "Red room",
        "url": "https://redroomuppsala.se/",
        "telephone": "+46707206575",
        "description": "Open mic-karaoke i centrala Uppsala med biljard och bar.",
        "address": {
            "@type": "PostalAddress",
            "streetAddress": "Kungsgatan 41",
            "addressLocality": "Uppsala",
            "addressCountry": "SE"
        },
        "openingHoursSpecification": [
            {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": [
                    "Sunday",
                    "Monday",
                    "Tuesday",
                    "Wednesday",
                    "Thursday"
                ],
                "opens": "19:00",
                "closes": "02:00"
            },
            {
                "@type": "OpeningHoursSpecification",
                "dayOfWeek": [
                    "Friday",
                    "Saturday"
                ],
                "opens": "19:00",
                "closes": "03:00"
            }
        ],
        "sameAs": [
            "https://www.instagram.com/redroom_uppsala/"
        ]
    }
    </script>
    

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Besley:wght@700;800;900&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="css/style.css">

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <nav class="navbar" aria-label="Huvudmeny">

            <ul class="nav-links">

                <li>
                    <a href="#karaoke">KARAOKE</a>
                </li>

                <li>
                    <a href="#oppettider">ÖPPETTIDER</a>
                </li>

                <li>
                    <a href="#kontakt">KONTAKT</a>
                </li>

                <li>
                    <button
                        class="language-toggle"
                        id="language-toggle"
                        type="button"
                        aria-label="Switch to English"
                   >    
                        🇬🇧
                   </button>
          </li>        
                
                <li>
                    <a
                        href="https://www.instagram.com/redroom_uppsala/"
                        target="_blank"
                        rel="noopener noreferrer"
                        aria-label="Instagram"
                    >
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                </li>

            </ul>

        </nav>

        <div class="hero-content">
            <h1>Red room</h1>
            <p>KARAOKE • BAR • UPPSALA</p>
        </div>

    </header>

    <main>

        <!-- Video strip 1 -->
        <section class="video-strip" aria-label="Red Room video">

            <video autoplay muted loop playsinline>
                <source src="videos/hero.mp4" type="video/mp4">
            </video>

        </section>

        <!-- Karaoke -->
        <section
            class="content-section karaoke-section"
            id="karaoke"
            aria-labelledby="karaoke-title"
        >

    <h2 id="karaoke-title">
        <a class="karaoke-info-link" href="karaoke-uppsala/">KARAOKE</a>
    </h2>

    <div
        class="karaoke-schedule"
        id="karaoke-schedule"
    ></div>

    </section>

    <!-- Pool image strip -->
    <section class="image-strip" aria-label="Biljard på Red Room">
        <img
            src="images/pool.jpg"
            alt="Biljard på Red Room i Uppsala"
        >
    </section>

        <!-- Bar opening hours -->
        <section
            class="content-section opening-hours-section"
            id="oppettider"
            aria-labelledby="opening-hours-title"
        >

            <h2 id="opening-hours-title">ÖPPETTIDER BAR</h2>

            <div
                class="opening-hours-list"
                id="opening-hours-list"
            ></div>

        </section>

        <!-- Video strip 2 -->
        <section class="video-strip" aria-label="Red Room video">

            <video autoplay muted loop playsinline>
                <source src="videos/hero2.mp4" type="video/mp4">
            </video>

        </section>

        <!-- Instagram -->
        <section
            class="content-section instagram-section"
            aria-labelledby="instagram-title"
        >

            <h2
                id="instagram-title"
                class="instagram-title"
            >
                FÖLJ TALANGERNA
            </h2>

            <blockquote
                class="instagram-media"
                data-instgrm-permalink="https://www.instagram.com/reel/DZbA2jERhtV/"
                data-instgrm-version="14"
            ></blockquote>

        </section>

        <!-- Venue image strip -->
        <section class="image-strip" aria-label="Red Room på Kungsgatan">

            <img
                src="images/venue.jpg"
                alt="Red Room på Kungsgatan i Uppsala"
            >

        </section>

        <!-- Google Maps -->
        <section
            class="map-section"
            aria-label="Karta till Red Room Uppsala"
        >

            <iframe
                src="https://www.google.com/maps?q=Kungsgatan+41,+Uppsala&output=embed"
                title="Karta till Red Room, Kungsgatan 41 i Uppsala"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
            ></iframe>

        </section>

    </main>   

    <!-- Footer -->
    <footer class="site-footer" id="kontakt">

        <div class="footer-grid">

            <section>

                <h2>KONTAKT</h2>

                <p>
                    <a href="tel:+46707206575">
                        070 720 65 75
                    </a>
                </p>

                <p>
                    <a href="mailto:redroomuppsala@gmail.com">
                        redroomuppsala@gmail.com
                    </a>
                </p>

                <address>
                    Kungsgatan 41<br>
                    Uppsala
                </address>

            </section>

            <section>

                <h2>FÖLJ OSS</h2>

                <a
                    class="instagram-icon"
                    href="https://www.instagram.com/redroom_uppsala/"
                    target="_blank"
                    rel="noopener noreferrer"
                    aria-label="Instagram"
                >
                    <i class="fa-brands fa-instagram"></i>
                </a>

            </section>

        </div>

        <div class="footer-bottom">
            <a href="integritet.html">Integritetspolicy</a>
        </div>

    </footer>

    <script async src="https://www.instagram.com/embed.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
