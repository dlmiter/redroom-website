<!DOCTYPE html>
<html lang="sv">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Red Room Uppsala | Karaoke & Bar</title>

    <meta
        name="description"
        content="Red Room Uppsala – karaoke och bar i Uppsala. Karaoke torsdag, fredag och lördag."
    >

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="css/style.css">
    <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
>
</head>

<body>

    <!-- Header -->
    <header class="site-header">

        <nav class="navbar" aria-label="Huvudmeny">

            <a class="logo" href="index.html">
                Red room
            </a>

            <ul class="nav-links">
                <li><a href="#karaoke">Karaoke</a></li>
                <li><a href="#kontakt">Kontakt</a></li>
                <li>
    <a
        href="https://www.instagram.com/redroom_uppsala/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Instagram"
    >
        <i class="fa-brands fa-instagram"></i>
    </a>
</li>
            </ul>

        </nav>

        <div class="hero-content">
            <h1>RED ROOM</h1>
            <p>KARAOKE • BAR • UPPSALA</p>
        </div>

    </header>

    <main>

        <!-- Video strip 1 -->
        <section class="video-strip" aria-label="Red Room video">
            <video autoplay muted loop playsinline>
                <source src="videos/hero.mp4" type="video/mp4">
            </video>
        </section>

        <!-- Karaoke -->
        <section
            class="content-section karaoke-section"
            id="karaoke"
            aria-labelledby="karaoke-title"
        >

            <h2 id="karaoke-title">KARAOKE</h2>

            <div class="karaoke-schedule">

                <div class="day">
                    <span class="weekday">TORSDAGAR</span>
                    <span class="time">21</span>
                </div>

                <div class="day">
                    <span class="weekday">FREDAGAR</span>
                    <span class="time">22</span>
                </div>

                <div class="day">
                    <span class="weekday">LÖRDAGAR</span>
                    <span class="time">22</span>
                </div>

            </div>

        </section>

        <!-- Video strip 2 -->
        <section class="video-strip" aria-label="Red Room video">
            <video autoplay muted loop playsinline>
                <source src="videos/hero2.mp4" type="video/mp4">
            </video>
        </section>

        <!-- Instagram -->
        <section
            class="content-section instagram-section"
            aria-labelledby="instagram-title"
        >

            <h2 id="instagram-title" class="instagram-title">FÖLJ TALANGERNA</h2>

            <blockquote
                class="instagram-media"
                data-instgrm-permalink="https://www.instagram.com/reel/DZbA2jERhtV/"
                data-instgrm-version="14">
            </blockquote>

        </section>

        <!-- Video strip 3 -->
        <section class="video-strip" aria-label="Red Room video">
            <video autoplay muted loop playsinline>
                <source src="videos/hero3.mp4" type="video/mp4">
            </video>
        </section>

        <!-- Google Maps -->
        <section class="map-section" aria-label="Karta till Red Room Uppsala">

            <iframe
                src="https://www.google.com/maps?q=Kungsgatan+41,+Uppsala&output=embed"
                title="Karta till Red Room, Kungsgatan 41 i Uppsala"
                loading="lazy"
                referrerpolicy="no-referrer-when-downgrade"
            ></iframe>

        </section>

    </main>

    <!-- Footer -->
    <footer class="site-footer" id="kontakt">

        <div class="footer-grid">

            <section>
                <h2>ÖPPETTIDER • BAR</h2>
                <p>Öppet alla kvällar</p>
            </section>

            <section>
                <h2>KONTAKT</h2>

                <p>
                    <a href="tel:+46707206575">
                        070 720 65 75
                    </a>
                </p>

                <p>
                    <a href="mailto:redroomuppsala@gmail.com">
                        redroomuppsala@gmail.com
                    </a>
                </p>

                <address>
                    Kungsgatan 41<br>
                    Uppsala
                </address>
            </section>

            <section>
                <h2>FÖLJ OSS</h2>

                <a
    class="instagram-icon"
    href="https://www.instagram.com/redroom_uppsala/"
    target="_blank"
    rel="noopener noreferrer"
    aria-label="Instagram"
>
    <i class="fa-brands fa-instagram"></i>
</a>
            </section>

        </div>

        <div class="footer-bottom">
            <a href="integritet.html">Integritetspolicy</a>
        </div>

    </footer>

    <script async src="https://www.instagram.com/embed.js"></script>
    <script src="js/script.js"></script>

</body>

</html>
